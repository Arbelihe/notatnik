name: Zbuduj APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Kompilacja
        run: gradle --no-daemon assembleRelease

      - name: Przygotuj plik
        run: cp app/build/outputs/apk/release/app-release.apk Notatnik.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Notatnik
          path: Notatnik.apk

      - name: Opublikuj wydanie
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" Notatnik.apk \
            --title "Notatnik ${TAG}" \
            --notes "Pobierz Notatnik.apk na telefonie i zainstaluj."
